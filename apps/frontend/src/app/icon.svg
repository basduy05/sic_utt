<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="medibot-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="cross-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f87171" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#medibot-grad)" />
  
  <!-- Subtle Medical Cross in Background -->
  <rect x="27" y="10" width="10" height="44" rx="3" fill="#ffffff" fill-opacity="0.2" />
  <rect x="10" y="27" width="44" height="10" rx="3" fill="#ffffff" fill-opacity="0.2" />

  <!-- White Inner Stethoscope / Medical AI Icon -->
  <path d="M20 16 C20 12, 44 12, 44 16 L44 26 C44 34, 38 40, 32 40 C26 40, 20 34, 20 26 Z" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Stethoscope Center Tube to Chestpiece -->
  <path d="M32 40 L32 46 C32 50, 38 52, 42 52" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="44" cy="52" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="3" />

  <!-- Heartbeat Pulse Line (ECG Wave) in center -->
  <path d="M16 26 L24 26 L27 20 L32 32 L36 23 L39 28 L48 28" fill="none" stroke="#fef08a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- High-tech AI Sparkle dot -->
  <circle cx="50" cy="14" r="3" fill="#ffffff" />
</svg>
