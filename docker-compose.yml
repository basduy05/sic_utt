version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: medai-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: medai-redis
    ports:
      - "6379:6379"

  mongodb:
    image: mongo:6-jammy
    container_name: medai-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: medai-backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - QDRANT_HOST=qdrant
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - mongodb
      - qdrant
      - redis
    volumes:
      - ./data:/data

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: medai-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/api/v1/ws
    depends_on:
      - backend

volumes:
  qdrant_data:
  mongo_data:
